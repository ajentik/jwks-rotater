# This rule is not used by the project jwks-rotater itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the jwks.ajentik.ai.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: jwks-rotater
    app.kubernetes.io/managed-by: kustomize
  name: jwksrotationpolicy-editor-role
rules:
- apiGroups:
  - jwks.ajentik.ai
  resources:
  - jwksrotationpolicies
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - jwks.ajentik.ai
  resources:
  - jwksrotationpolicies/status
  verbs:
  - get
