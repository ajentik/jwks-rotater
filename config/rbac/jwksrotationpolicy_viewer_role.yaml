# This rule is not used by the project jwks-rotater itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to jwks.ajentik.ai resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: jwks-rotater
    app.kubernetes.io/managed-by: kustomize
  name: jwksrotationpolicy-viewer-role
rules:
- apiGroups:
  - jwks.ajentik.ai
  resources:
  - jwksrotationpolicies
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - jwks.ajentik.ai
  resources:
  - jwksrotationpolicies/status
  verbs:
  - get
